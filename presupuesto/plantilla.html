<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Kreatures Studio · Presupuesto</title>
<style>
  /* Paleta web Kreatures (tema Bestiary): rojo intenso + azul profundo */
  :root {
    --red: #D62828; --red-dark: #A81F1F;
    --blue: #003049; --blue-deep: #002033;
    --ink: #14232e; --muted: #5a6b76;
    --line: #e3e7ea; --zebra: #f4f5f6; --paper: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); background: #dfe4e7;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }
  .topbar, .botbar { background: var(--red); }
  .topbar { height: 10px; }
  .botbar { height: 14px; }
  .sheet {
    background: var(--paper); max-width: 820px; margin: 0 auto;
    padding: 40px 48px 30px; min-height: 100vh;
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .sigil {
    width: 44px; height: 44px; border-radius: 10px; flex: none;
    background: var(--blue); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .brand .name { font-weight: 900; letter-spacing: .14em; font-size: 19px; color: var(--blue); }
  .brand .sub { font-size: 11px; letter-spacing: .22em; color: var(--red); font-weight: 700; }
  .emisor { text-align: right; font-size: 12px; line-height: 1.55; color: var(--ink); }
  .emisor b { color: var(--blue); }
  .client {
    display: flex; gap: 12px; align-items: flex-start;
    margin: 26px 0 6px; font-size: 12.5px; line-height: 1.6;
  }
  .client .ico {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--red); color: var(--red);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .doctitle { display: flex; align-items: center; gap: 10px; margin: 26px 0 2px; }
  .doctitle .doc {
    width: 30px; height: 30px; border-radius: 7px; background: #fff;
    border: 2px solid var(--red); color: var(--red); font-size: 16px;
    display: flex; align-items: center; justify-content: center; font-weight: 900;
  }
  .doctitle h1 { margin: 0; font-size: 30px; color: var(--blue); letter-spacing: .01em; }
  .docmeta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .docmeta b { color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    text-align: left; font-size: 11px; letter-spacing: .04em; color: var(--muted);
    border-bottom: 2px solid var(--blue); padding: 6px 8px;
  }
  thead th.num, tbody td.num { text-align: right; }
  tbody td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:nth-child(even) td { background: var(--zebra); }
  td.n { width: 46px; }
  td.n span {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 30px; height: 24px; padding: 0 6px;
    background: var(--red); color: #fff; font-weight: 800; font-size: 12px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
  td.desc { line-height: 1.5; }
  td.money, th.money { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.total { color: var(--red); font-weight: 800; }
  .bottom { display: flex; justify-content: space-between; gap: 24px; margin-top: 26px; }
  .notes { font-size: 11px; color: var(--muted); line-height: 1.7; max-width: 46%; }
  .notes b { color: var(--ink); }
  .totals { margin-left: auto; text-align: right; font-size: 12.5px; min-width: 250px; }
  .totals .grand { font-size: 15px; margin-bottom: 4px; }
  .totals .grand b { color: var(--red); font-size: 24px; font-variant-numeric: tabular-nums; }
  .totals table { font-size: 12px; }
  .totals td { border: 0; padding: 2px 0 2px 8px; }
  .totals td:last-child { font-variant-numeric: tabular-nums; }
  footer { display: flex; justify-content: flex-end; font-size: 10.5px; color: var(--muted); margin-top: 40px; }
  #printbar { text-align: center; padding: 14px; background: var(--blue-deep); position: sticky; bottom: 0; }
  #printbar button {
    font-size: 14px; font-weight: 800; cursor: pointer; border: 0; border-radius: 8px;
    padding: 11px 26px; background: var(--red); color: #fff;
  }
  #printbar button:hover { background: var(--red-dark); }
  #printbar span { color: #9fb3c0; font-size: 12px; margin-left: 10px; }
  @media print {
    body { background: #fff; }
    .sheet { max-width: none; min-height: auto; padding: 0; }
    #printbar { display: none !important; }
    .topbar { height: 8px; }
    @page { size: A4; margin: 14mm 12mm; }
  }
</style>
</head>
<body>
<div class="topbar"></div>
<div class="sheet">
  <header>
    <div class="brand">
      <div class="sigil">◈</div>
      <div>
        <div class="name">KREATURES</div>
        <div class="sub">BEHIND YOUR PROJECT</div>
      </div>
    </div>
    <div class="emisor" id="emisor"></div>
  </header>

  <div class="client">
    <div class="ico">◈</div>
    <div id="cliente"></div>
  </div>

  <div class="doctitle"><div class="doc">▤</div><h1>Presupuesto</h1></div>
  <div class="docmeta"><span>Nº <b id="mNum"></b></span><span id="mConcepto"></span><span>Fecha: <b id="mFecha"></b></span></div>

  <table>
    <thead><tr>
      <th style="width:46px">Nº.</th><th>Descripción</th>
      <th class="num">Cantidad</th><th class="money">Precio</th>
      <th class="money">Dto.</th><th class="money">Total</th>
    </tr></thead>
    <tbody id="lineas"></tbody>
  </table>

  <div class="bottom">
    <div class="notes" id="notas"></div>
    <div class="totals" id="totales"></div>
  </div>

  <footer>PÁGINA: 1 / 1</footer>
</div>
<div class="botbar"></div>

<div id="printbar">
  <button onclick="window.print()">Imprimir / guardar PDF</button><span>Revisa los datos de CONFIG antes de enviar</span>
</div>

<script>
'use strict';
/* ======== CONFIG: edita aquí cada presupuesto y recarga ======== */
var CONFIG = {
  numero: '2026/001',
  fecha: 'auto', /* 'auto' = hoy; o '12/09/2026' */
  concepto: 'Escape Room · PrintMyEscape',
  emisor: {
    nombre: 'Kreatures Studio',
    email: 'hello@kreatures.studio',
    web: 'kreatures-studio.github.io/website',
    lugar: 'España · Worldwide'
  },
  cliente: { /* <-- completar por cliente */
    nombre: 'Nombre del cliente',
    direccion: 'Dirección',
    ciudad: 'Ciudad',
    extra: 'C.I.F./N.I.F.: — · Tel.: — · Email: —'
  },
  lineas: [
    { desc: 'Game Design', cant: 1, precio: 200, dto: 0 },
    { desc: 'Diseño Visual', cant: 1, precio: 300, dto: 0 },
    { desc: 'Maquetación', cant: 1, precio: 250, dto: 0 },
    { desc: 'Programación Web', cant: 1, precio: 250, dto: 0 }
  ],
  iva: 21, /* % IVA; 0 si exento o con IVA incluido */
  observaciones: 'Presupuesto válido durante 30 días.',
  pago: 'Forma de pago: a convenir.'
};
/* =============================================================== */

function eur(n) {
  return n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '€';
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function fechaHoy() {
  var d = new Date();
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
}

var em = CONFIG.emisor, cl = CONFIG.cliente;
document.getElementById('emisor').innerHTML =
  '<b>' + esc(em.nombre) + '</b><br>' + esc(em.email) + '<br>' +
  esc(em.web) + '<br>' + esc(em.lugar);
document.getElementById('cliente').innerHTML =
  '<b>' + esc(cl.nombre) + '</b><br>' + esc(cl.direccion) + '<br>' +
  esc(cl.ciudad) + '<br>' + esc(cl.extra);
document.getElementById('mNum').textContent = CONFIG.numero;
document.getElementById('mConcepto').textContent = CONFIG.concepto;
document.getElementById('mFecha').textContent = CONFIG.fecha === 'auto' ? fechaHoy() : CONFIG.fecha;

var base = 0, tb = document.getElementById('lineas');
CONFIG.lineas.forEach(function (l, i) {
  var t = l.cant * l.precio * (1 - (l.dto || 0) / 100);
  base += t;
  var tr = document.createElement('tr');
  tr.innerHTML = '<td class="n"><span>' + (i + 1) + '.</span></td>' +
    '<td class="desc">' + esc(l.desc) + '</td>' +
    '<td class="num">' + l.cant.toLocaleString('es-ES', { minimumFractionDigits: 2 }) + '</td>' +
    '<td class="money">' + eur(l.precio) + '</td>' +
    '<td class="money">' + (l.dto || 0).toLocaleString('es-ES') + '%</td>' +
    '<td class="money total">' + eur(t) + '</td>';
  tb.appendChild(tr);
});
var iva = base * CONFIG.iva / 100, total = base + iva;
document.getElementById('notas').innerHTML =
  'OBSERVACIONES: ' + esc(CONFIG.observaciones) + '<br><b>' + esc(CONFIG.concepto) + '</b><br>' + esc(CONFIG.pago);
document.getElementById('totales').innerHTML =
  '<div class="grand">Total: <b>' + eur(total) + '</b></div>' +
  '<table><tr><td>BASE IMPONIBLE</td><td>' + eur(base) + '</td></tr>' +
  '<tr><td>TOTAL I.V.A. (' + CONFIG.iva.toLocaleString('es-ES') + '%)</td><td>' + eur(iva) + '</td></tr></table>';
</script>
</body>
</html>
