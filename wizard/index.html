<style>

  #done { text-align: center; }

  /* ---- modo móvil: página con scroll ---- */
  #mwrap { display: none; width: min(94vw, 620px); padding-bottom: 110px; }
  body.mobile main { align-items: stretch; padding: 16px 12px 120px; }
  body.mobile #card { display: none; }
  body.mobile #mwrap { display: block; }

</style>

<script>
'use strict';
/* Asistente de personalización. Desktop: pasos agrupados. Móvil (<=640px):
   página con scroll. Textos en localStorage, fotos en IndexedDB (fallback memoria). */

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
var store = {
  mem: {},
  _ls: (function () {
    try { window.localStorage.setItem('__t__', '1'); window.localStorage.removeItem('__t__'); return true; }
    catch (e) { return false; }
  })(),
  get: function (k) {
    if (this._ls) { try { var v = window.localStorage.getItem(k); if (v !== null) return v; } catch (e) { this._ls = false; } }
    return (k in this.mem) ? this.mem[k] : null;
  },
  set: function (k, v) {
    if (this._ls) { try { window.localStorage.setItem(k, v); return; } catch (e) { this._ls = false; } }
    this.mem[k] = v;
  },
  del: function (k) {
    if (this._ls) { try { window.localStorage.removeItem(k); return; } catch (e) { this._ls = false; } }
    delete this.mem[k];
  }
};
var DRAFT_KEY = 'pme-wizard-draft';

/* ---------- fotos en IndexedDB (persisten recargas) ---------- */
var photos = {}, idbOK = false, idbDB = null;
var idb = {
  open: function (cb) {
    if (!window.indexedDB) { cb(false); return; }
    try {
      var rq = window.indexedDB.open('pme-wizard', 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore('photos'); };
      rq.onsuccess = function () { idbDB = rq.result; idbOK = true; cb(true); };
      rq.onerror = function () { cb(false); };
    } catch (e) { cb(false); }
  },
  save: function (k, v) {
    if (!idbOK) return;
    try { idbDB.transaction('photos', 'readwrite').objectStore('photos').put(v, k); } catch (e) {}
  },
  remove: function (k) {
    if (!idbOK) return;
    try { idbDB.transaction('photos', 'readwrite').objectStore('photos').delete(k); } catch (e) {}
  },
  loadAll: function (cb) {
    if (!idbOK) { cb({}); return; }
    try {
      var rq = idbDB.transaction('photos', 'readonly').objectStore('photos').getAll();
      rq.onsuccess = function () {
        var out = {}, keys = rq.result;
        /* getAll sin claves: recuperamos por cursor para mantener la clave */
        var cur = idbDB.transaction('photos', 'readonly').objectStore('photos').openCursor();
        cur.onsuccess = function () {
          var c = cur.result;
          if (c) { out[c.key] = c.value; c.continue(); }
          else cb(out);
        };
        cur.onerror = function () { cb(out); };
      };
      rq.onerror = function () { cb({}); };
    } catch (e) { cb({}); }
  }
};

/* ---------- definición de pantallas (2-3 campos relacionados) ---------- */
function T(id, q, o) { o = o || {}; return { id: id, type: 'text', q: q, required: !!o.req, max: o.max || 0, desc: o.desc || '', ej: o.ej || '' }; }
function L(id, q, o) { o = o || {}; return { id: id, type: 'long', q: q, required: !!o.req, max: o.max || 0, desc: o.desc || '', ej: o.ej || '' }; }
function N(id, q, o) { o = o || {}; return { id: id, type: 'number', q: q, required: !!o.req, min: o.min, max: o.max }; }
function P(id, q, o) { o = o || {}; return { id: id, type: 'photo', q: q, required: !!o.req, desc: o.desc || '1 archivo de imagen, tamaño máximo 10 MB.' }; }
function M(id, q, o) { o = o || {}; return { id: id, type: 'multi', q: q, desc: o.desc || '' }; }

var WEAK_OPTS = ['Llegar tarde', 'Robar comida ajena', 'Contar chistes malos', 'Hacer trampas jugando'];
var SECTIONS = [{ id: 'intro', title: 'Inicio' }, { id: 'b', title: 'El cumpleañero' }];
for (var _n = 1; _n <= 8; _n++) SECTIONS.push({ id: 's' + _n, title: 'Sospechoso ' + _n });

var SCREENS = [
  { id: 'intro', sec: 'intro', title: 'Cómo va a ser el proceso',
    desc: 'Vas a personalizar el escape room «El Regalo Robado» con tus amigos y familiares como protagonistas.',
    fields: [{ id: 'intro_ok', type: 'check', q: 'Comprendo cómo funciona y tengo las fotos a mano (o las subiré sobre la marcha)', required: true }],
    bullets: [
      'Te llevará unos <b>15–20 minutos</b>. Puedes salir y volver: tus respuestas se guardan en este equipo.',
      'Vas a necesitar: el <b>nombre y apodo</b> de 8 sospechosos más el cumpleañero, <b>9 fotos</b> (máx. 10 MB cada una) y un par de <b>lugares donde se escondería</b> cada uno.',
      'Al final revisaremos todo junto antes de generar tu juego personalizado.'
    ] },
  { id: 'b1', sec: 'b', title: '¿Quién es el cumpleañero?', desc: 'Empezamos por lo básico.',
    fields: [T('b_name', '¿Cómo se llama?', { req: 1, max: 24 }), T('b_alias', 'Su alias (opcional)', { max: 24 }), N('b_age', '¿Cuántos años cumple?', { req: 1, min: 1, max: 120 })] },
  { id: 'b2', sec: 'b', title: 'Su foto', fields: [P('b_photo', 'Sube su foto')] },
  { id: 'b3', sec: 'b', title: 'Cómo se le conoce',
    fields: [L('b_known', '¿Por qué se le conoce?', { max: 280, ej: 'Por comer hamburguesas, por pillarse un pedo monumental cada vez que sale de fiesta…' }),
      M('b_weak', 'Su mayor debilidad es…', { desc: 'Puedes seleccionar varias opciones e incluso escribir otra.' })] },
  { id: 'b4', sec: 'b', title: 'Algo más sobre esta persona',
    fields: [L('b_info', 'Información que sus amigos y familiares consideran importante', { max: 280 }),
      L('b_notes', 'Notas y observaciones', { max: 280, desc: 'Todo lo que nos quieras contar y no encaje arriba.' })] }
];
(function () {

  $('q').textContent = 'Revisa tus respuestas';
  $('desc').textContent = idbOK
    ? 'Pulsa Editar en lo que quieras cambiar. Las fotos están guardadas en este equipo.'
    : 'Pulsa Editar en lo que quieras cambiar. Las fotos solo viven en esta sesión del navegador.';
  A.innerHTML = '';
  var tools = document.createElement('label'); tools.className = 'review-tools';
  var cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'onlyMiss';
  tools.appendChild(cb);
  var ts = document.createElement('span'); ts.textContent = 'Mostrar solo lo que falta'; tools.appendChild(ts);
  A.appendChild(tools);
  var dw = document.createElement('div'); dw.id = 'dupwarn'; A.appendChild(dw);
  function refreshDup() {
    var d = dupNames();
    if (d.length) { dw.style.display = ''; dw.textContent = '⚠ Nombre repetido: ' + d.join(', ') + '. Dos sospechosos no pueden llamarse igual.'; }
    else dw.style.display = 'none';
  }
  refreshDup();
  var list = document.createElement('div'); list.id = 'reviewList'; A.appendChild(list);
  function build() {
    list.innerHTML = '';
    var onlyMiss = cb.checked;
    SECTIONS.forEach(function (sec) {
      if (sec.id === 'intro') return;
      var fields = [];
      SCREENS.forEach(function (s) {
        if (s.sec !== sec.id) return;
        s.fields.forEach(function (f) {
          if (f.type === 'check') return;
          fields.push(f);
        });
      });
      var rows = fields.filter(function (f) {
        if (!onlyMiss) return true;
        if (f.type === 'photo') return !photos['photo_' + f.id];
        return !answers[f.id];
      });
      if (!rows.length) return;
      var gd = document.createElement('div'); gd.className = 'review-group';
      var h = document.createElement('h3'); h.textContent = kickerFor(sec.id); gd.appendChild(h);
      rows.forEach(function (f) {
        var row = document.createElement('div'); row.className = 'review-row';
        var b = document.createElement('b'); b.textContent = shortLabel(f.id); row.appendChild(b);
        var sp = document.createElement('span');
        if (f.type === 'photo') {
          var key = 'photo_' + f.id;
          if (photos[key]) { var im = document.createElement('img'); im.src = photos[key]; im.className = 'review-thumb'; sp.appendChild(im); }
          else sp.innerHTML = '<span class="miss">sin foto</span>';
        } else {
          var v = (answers[f.id] || '').replace(/\|\|/g, ', ');
          if (v) sp.textContent = v;
          else sp.innerHTML = f.required ? '<span class="miss">¡falta!</span>' : '<span class="miss">—</span>';
        }
        row.appendChild(sp);
        var eb = document.createElement('button'); eb.textContent = 'Editar';
        eb.onclick = function () { editField(f.id, fromMobile); };
        row.appendChild(eb);
        gd.appendChild(row);
      });
      list.appendChild(gd);
    });
    if (!list.children.length) {
      var p = document.createElement('p'); p.textContent = 'Todo completo. ¡Buen trabajo!'; list.appendChild(p);
    }
  }
  cb.onchange = build;
  build();
}
function editField(fid, fromMobile) {
  if (fromMobile || isMobile()) {
    secPos = secIndex(SCREENS[screenOfField(fid)].sec);
    view = 'steps'; render();
    setTimeout(function () {
      var el = document.querySelector('#mwrap .field[data-field="' + fid + '"]');
      if (el) {
        el.scrollIntoView({ block: 'center' });
        var inp = el.querySelector('input, textarea');
        if (inp) { try { inp.focus(); } catch (e) {} }
      }
    }, 60);
  } else {
    idx = screenOfField(fid); view = 'steps'; render(); window.scrollTo(0, 0);
  }
}
function reviewChrome() {
  var total = SCREENS.length + 1;  $('progress').firstElementChild.style.width = Math.round(100 * SCREENS.length / total) + '%';
  $('stepcount').textContent = 'Revisión';
  if (isMobile()) { document.body.classList.add('showcard'); $('back').style.display = ''; }
  setNav(false, 'Terminar ✓');
}
function finish() {
  var missing = [];
  SCREENS.forEach(function (s) { s.fields.forEach(function (f) {
    if (f.required && !answers[f.id]) missing.push(shortLabel(f.id));
  }); });
  if (missing.length) {
    var fid = null;
    SCREENS.forEach(function (s) { s.fields.forEach(function (f) {
      if (!fid && f.required && !answers[f.id]) fid = f.id;
    }); });
    if (isMobile()) { view = 'steps'; render(); editField(fid, true); }
    else { idx = screenOfField(fid); view = 'steps'; render(); }
    showErr('Te falta: ' + missing.join(', '));
    window.scrollTo(0, 0);
    return;
  }
  view = 'done';
  document.body.classList.add('showcard');
  var A = $('answer'); A.innerHTML = '';
  var k = $('kicker'); k.innerHTML = '';
  var kt = document.createElement('span'); kt.textContent = 'Completado'; k.appendChild(kt);
  $('q').textContent = '¡Listo! Respuestas guardadas';
  $('desc').textContent = 'Tus respuestas están guardadas en este equipo. La generación del PDF personalizado es la siguiente fase.';
  var dups = dupNames();
  var d = document.createElement('div'); d.id = 'done';
  d.innerHTML = '<div class="big">🎉</div><p>Has respondido todas las preguntas.<br>Puedes descargar tus respuestas o empezar de nuevo.</p>' +
    (dups.length ? '<p style="color:var(--danger);font-weight:800;">⚠ Ojo: nombre repetido (' + esc(dups.join(', ')) + '). Revísalo antes de generar el juego.</p>' : '');
  var dl = document.createElement('p');
  var b1 = document.createElement('button');
  b1.textContent = 'Descargar respuestas (.json)';
  b1.style.cssText = 'font-size:14px;font-weight:800;cursor:pointer;padding:11px 22px;border:0;border-radius:8px;background:var(--abyss);color:#fff;margin:4px;min-height:48px;';
  b1.onclick = downloadJson;
  var b2 = document.createElement('button');
  b2.textContent = 'Empezar de nuevo';
  b2.style.cssText = 'font-size:14px;font-weight:800;cursor:pointer;padding:11px 22px;border:2px solid var(--abyss);border-radius:8px;background:#fff;color:var(--ink);margin:4px;min-height:48px;';
  b2.onclick = function () {
    if (!confirm('¿Borrar todas las respuestas y empezar de nuevo?')) return;
    answers = {}; photos = {}; multiOther = {}; idx = 0; view = 'steps';
    store.del(DRAFT_KEY); render(); window.scrollTo(0, 0);
  };
  dl.appendChild(b1); dl.appendChild(b2); d.appendChild(dl);
  A.appendChild(d);
  $('progress').firstElementChild.style.width = '100%';
  $('stepcount').textContent = 'Fin';
  setNav(true, 'Terminar ✓', true);
}
function downloadJson() {
  var data = { form: 'el-regalo-robado', version: 2, answers: answers, exportedAt: new Date().toISOString() };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'respuestas-regalo-robado.json';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ---------- menú de secciones ---------- */
function menuStatus(sec) {
  if (sec === 'intro') return answers.intro_ok === '1' ? 'done' : '';
  var miss = missingOf(sec);
  return miss.length ? miss.length : 'done';
}
function buildMenu() {
  var L = $('drawerList'); if (!L) return; L.innerHTML = '';
  var cur = currentSec();
  SECTIONS.forEach(function (sec) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'secItem';
    var st = menuStatus(sec.id);
    if (st === 'done') b.classList.add('done');
    if (cur === sec.id) b.classList.add('cur');
    var dot = document.createElement('span'); dot.className = 'dot'; dot.textContent = st === 'done' ? '✓' : (SECTIONS.indexOf(sec) + 1);
    b.appendChild(dot);
    var t = document.createElement('span'); t.textContent = kickerFor(sec.id); b.appendChild(t);
    if (st !== 'done' && typeof st === 'number') {
      var m = document.createElement('span'); m.className = 'miss'; m.textContent = 'faltan ' + st; b.appendChild(m);
    }
    b.onclick = (function (id) { return function () { jumpTo(id); }; })(sec.id);
    L.appendChild(b);
  });
  var rv = document.createElement('button'); rv.type = 'button'; rv.className = 'secItem' + (view === 'review' ? ' cur' : '');
  var dot2 = document.createElement('span'); dot2.className = 'dot'; dot2.textContent = '≡'; rv.appendChild(dot2);
  var t2 = document.createElement('span'); t2.textContent = 'Revisión final'; rv.appendChild(t2);
  rv.onclick = function () {
    closeMenu();
    if (isMobile()) mobileGoReview();
    else { var s = SCREENS[idx]; if (s) s.fields.forEach(function (f) { if (f.type === 'multi') collectMulti(f.id); else readControl(f, $('answer')); }); saveDraft(); view = 'steps'; idx = SCREENS.length; render(); window.scrollTo(0, 0); }
  };
  L.appendChild(rv);
}
function openMenu() {
  buildMenu();
  if (!isMobile()) return; /* en desktop el sidebar siempre está visible */
  $('scrim').classList.add('open');
  $('drawer').classList.add('open');
}
function closeMenu() {
  $('scrim').classList.remove('open');
  $('drawer').classList.remove('open');
}
function jumpTo(sec) {
  closeMenu();
  if (isMobile()) {
    if (view !== 'review') readAll($('mwrap'));
    secPos = secIndex(sec); view = 'steps'; render(); window.scrollTo(0, 0);
  } else {
    var s = SCREENS[idx];
    if (s) s.fields.forEach(function (f) { if (f.type === 'multi') collectMulti(f.id); else readControl(f, $('answer')); });
    saveDraft();
    idx = firstScreenOf(sec); view = 'steps'; render(); window.scrollTo(0, 0);
  }
}

/* ---------- render principal ---------- */
function render() {
  closeMenu();
  hideToast();
  $('next').disabled = false; $('dnext').disabled = false;
  if (view === 'done') return;
  if (isMobile()) {
    document.body.classList.add('mobile');
    if (view === 'review') { $('mwrap').innerHTML = ''; renderReview($('answer'), true); reviewChrome(); }
    else renderMobile();
  } else {
    document.body.classList.remove('mobile');
    $('mwrap').innerHTML = '';
    $('back').style.display = '';
    $('hintkeys').style.display = '';
    if (view === 'review') { renderReview($('answer'), false); reviewChrome(); }
    else renderStep();
    buildMenu();
  }
  try {
    var dd = JSON.parse(store.get(DRAFT_KEY) || 'null');
    if (dd && dd.savedAt) updateDraftInfo(dd.savedAt);
  } catch (e) {}
}

/* ---------- eventos ---------- */
$('next').onclick = goNext;
$('back').onclick = goBack;
$('dnext').onclick = goNext;
$('dback').onclick = goBack;
$('menuBtn').onclick = openMenu;
$('scrim').onclick = closeMenu;
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeMenu(); return; }
  if (e.key !== 'Enter') return;
  if (isMobile() || view !== 'steps' || idx >= SCREENS.length) return;
  var t = e.target;
  var tag = t && t.tagName ? t.tagName.toLowerCase() : '';
  if (tag === 'textarea' || tag === 'button') return;
  if (t && t.type === 'checkbox') return;
  var inputs = $('answer').querySelectorAll('input[type="text"], input[type="number"]');
  var arr = [];
  for (var i = 0; i < inputs.length; i++) arr.push(inputs[i]);
  var at = arr.indexOf(t);
  e.preventDefault();
  if (at >= 0 && at < arr.length - 1) { try { arr[at + 1].focus(); } catch (ex) {} }
  else goNext();
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute) return;
  var fid = t.getAttribute('data-fid');
  if (fid && (t.tagName.toLowerCase() === 'input' || t.tagName.toLowerCase() === 'textarea') && t.type !== 'checkbox') {
    answers[fid] = t.value;
    saveDraft();
    var w = t.closest ? t.closest('.field') : null;
    if (w) {
      var c = w.querySelector('.count');
      if (c) { var f = null; SCREENS.forEach(function (s) { s.fields.forEach(function (x) { if (x.id === fid) f = x; }); }); if (f && f.max) c.textContent = t.value.length + '/' + f.max; }
      if (w.classList.contains('bad') && t.value.trim()) { w.classList.remove('bad'); w.querySelector('.ferr').textContent = ''; }
    }
    if (isMobile()) $('progress').firstElementChild.style.width = mobileProgress() + '%';
    buildMenu();
  }
  var other = t.getAttribute && t.getAttribute('data-other');
  if (other) collectMulti(other);
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute) return;
  var fid = t.getAttribute('data-fid');
  if (fid && t.type === 'checkbox') {
    answers[fid] = t.checked ? '1' : '';
    saveDraft();
  }
});
if (window.matchMedia) {
  var mq = window.matchMedia('(max-width: 640px)');
  var lastMobile = mq.matches;
  if (mq.addEventListener) mq.addEventListener('change', function () {
    if (mq.matches === lastMobile) return;
    lastMobile = mq.matches;
    if (view === 'steps') readAll(document);
    if (lastMobile) secPos = secIndex(SCREENS[idx] ? SCREENS[idx].sec : 'intro');
    else idx = firstScreenOf(SECTIONS[secPos].id);
    saveDraft(); render();
  });
  else if (mq.addListener) mq.addListener(function () {
    if (view === 'steps') readAll(document);
    saveDraft(); render();
  });
}
$('filepick').onchange = function (e) {
  var f = e.target.files[0]; e.target.value = '';
  if (!f || !photoTarget) return;
  var fid = photoTarget; photoTarget = null;
  if (f.size > 10 * 1024 * 1024) { showErr('La foto supera los 10 MB. Elige otra.'); return; }
  if (!/^image\//.test(f.type)) { showErr('El archivo no es una imagen.'); return; }
  var r = new FileReader();
  r.onload = function () {
    var key = 'photo_' + fid;
    photos[key] = r.result;
    idb.save(key, r.result);
    saveDraft(); render();
  };
  r.readAsDataURL(f);
};

/* ---------- arranque ---------- */
saveDraft();
render();
idb.open(function () {
  idb.loadAll(function (ph) {
    var n = 0;
    for (var k in ph) { photos[k] = ph[k]; n++; }
    if (n) render();
  });
});
</script>
</body>
</html>
