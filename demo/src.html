<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>PrintMyEscape · Demo personalización</title>
<style>
  :root { --abyss:#0c2a2f; --teal:#0e7463; --sage:#b7c29b; --paper:#faf6ec; --ink:#22302a; --danger:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; color:var(--ink); background:var(--paper); font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; }
  header { padding:14px 18px; color:#fff; background:linear-gradient(135deg,var(--abyss),#14404a); border-bottom:4px solid var(--teal); display:flex; gap:12px; align-items:center; flex-wrap:wrap; position:sticky; top:0; z-index:10; }
  header h1 { font-size:17px; margin:0; text-transform:uppercase; letter-spacing:.06em; }
  header .lang { margin-left:auto; display:flex; gap:6px; align-items:center; font-size:13px; font-weight:700; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 120px; }
  section.card { background:#fffdf6; border:3px solid var(--abyss); border-radius:12px; padding:18px; margin-bottom:18px; box-shadow:6px 6px 0 rgba(14,116,99,.25); }
  section.card h2 { margin:0 0 4px; font-size:17px; text-transform:uppercase; letter-spacing:.05em; }
  section.card p.hint { margin:0 0 12px; font-size:12.5px; color:#4c5d53; }
  label.f { display:block; margin-bottom:12px; }
  label.f > span { display:block; font-size:13px; font-weight:800; margin-bottom:4px; }
  label.f > span .req { color:var(--danger); }
  label.f input[type=text], label.f textarea {
    width:100%; font-size:15px; font-family:inherit; padding:9px 10px; color:var(--ink);
    border:2px solid var(--abyss); border-radius:8px; background:#fff;
  }
  label.f textarea { min-height:70px; resize:vertical; }
  label.f input:focus, label.f textarea:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(14,116,99,.25); }
  label.f.bad input, label.f.bad textarea { border-color:var(--danger); }
  .photorow { display:flex; gap:10px; align-items:center; }
  .photorow img { width:64px; height:64px; object-fit:cover; border-radius:8px; border:2px solid var(--abyss); display:none; }
  .photorow img.show { display:block; }
  .photorow input { font-size:13px; }
  #navbar { position:fixed; left:0; right:0; bottom:0; background:rgba(250,246,236,.97); border-top:3px solid var(--abyss); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; z-index:10; }
  #navbar button { font-size:15px; font-weight:900; cursor:pointer; border:0; border-radius:8px; padding:12px 22px; color:#fff; background:var(--teal); box-shadow:3px 3px 0 var(--abyss); min-height:48px; }
  #navbar button.ghost { background:#fff; color:var(--ink); border:2px solid var(--abyss); box-shadow:none; }
  #navbar button:disabled { opacity:.5; cursor:wait; }
  #progress { width:180px; height:12px; border:2px solid var(--abyss); border-radius:999px; overflow:hidden; display:none; }
  #progress > div { height:100%; width:0%; background:var(--teal); }
  #status { font-size:13px; font-weight:700; }
  #dl { display:none; font-weight:900; color:var(--teal-deep); }
  #err { display:none; background:var(--danger); color:#fff; font-size:13px; font-weight:700; padding:9px 12px; border-radius:8px; margin-bottom:14px; }
  footer { text-align:center; font-size:11.5px; color:#4c5d53; padding:0 16px 130px; }
</style>
</head>
<body>
<header>
  <h1>◈ PrintMyEscape · Demo</h1>
  <div class="lang">Idioma del PDF:
    <label><input type="radio" name="lang" value="es" checked> ES</label>
    <label><input type="radio" name="lang" value="en"> EN</label>
  </div>
</header>
<main id="form"></main>
<footer>Demo técnica: todo se procesa en tu equipo, nada se sube a ningún servidor.</footer>
<div id="navbar">
  <button id="bExample" class="ghost">Rellenar ejemplo</button>
  <button id="bGo">Generar PDF →</button>
  <div id="progress"><div></div></div>
  <span id="status"></span>
  <a id="dl" href="#" download="escape-personalizado.pdf">Descargar PDF ↓</a>
</div>
<div id="errbox"></div>
<script>/*__PDFLIB__*/</script>
<script>/*__FONTKIT__*/</script>
<script>/*__COMPOSE__*/</script>
<script>/*__DATA__*/</script>
<script>
'use strict';
/* Demo: formulario generado desde la plantilla + composición en navegador. */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const TPL = PME_DEMO_DATA.template;
const I18N_Q = {
  NOMBRE_CUMPLE: 'Nombre de la persona homenajeada', FAMA: '¿Por qué se le conoce?',
  DEBILIDAD: 'Su mayor debilidad', TALENTO: 'Su mayor talento',
  SOSPECHA: 'Si fuera sospechoso, ¿de qué sería?', OTRO: 'Otra debilidad (línea «Otro:»)',
  FOTO_CUMPLE: 'Foto del homenajeado',
  RESULTADO_TEST: 'Resultado del test', 'NOMBRE_4.2': 'Nombre del contacto del chat',
  MENSAJE_PERSONALIZADO: 'Mensaje de la burbuja del chat', BUSQUEDA_1: 'Primera búsqueda',
  BUSQUEDA_2: 'Segunda búsqueda',
};
function qLabel(fid) {
  if (I18N_Q[fid]) return I18N_Q[fid];
  let m = fid.match(/^NOMBRE_(\d+)$/);
  if (m) return 'Nombre del sospechoso ' + m[1];
  m = fid.match(/^S(\d+)_HIDE([AB])$/);
  if (m) return 'Escondite ' + (m[2] === 'A' ? '1' : '2') + ' del sospechoso ' + m[1];
  m = fid.match(/^FOTO_(\d+)$/);
  if (m) return 'Foto del sospechoso ' + m[1];
  return fid;
}
function isLong(fid) { return fid === 'MENSAJE_PERSONALIZADO'; }
function isPhoto(fid) {
  const f = TPL.fields.find((x) => x.id === fid);
  return f && f.type === 'image';
}
function isReq(fid) {
  return /^NOMBRE_\d+$/.test(fid) || /^S\d+_HIDE[AB]$/.test(fid) || fid === 'NOMBRE_CUMPLE';
}
const SECTIONS = [{ id: 'victima', title: 'La víctima', hint: 'Datos del homenajeado.',
  fields: ['NOMBRE_CUMPLE', 'FAMA', 'DEBILIDAD', 'TALENTO', 'SOSPECHA', 'OTRO', 'FOTO_CUMPLE'] }];
for (let n = 1; n <= 8; n++) {
  SECTIONS.push({ id: 's' + n, title: 'Sospechoso ' + n,
    hint: 'Sus datos salen en todas sus páginas con la misma foto.',
    fields: ['NOMBRE_' + n, 'S' + n + '_HIDEA', 'S' + n + '_HIDEB', 'FOTO_' + n] });
}
SECTIONS.push({ id: 'pruebas', title: 'Pruebas y mensajes', hint: 'Textos de las pruebas del juego.',
  fields: ['RESULTADO_TEST', 'NOMBRE_4.2', 'MENSAJE_PERSONALIZADO', 'BUSQUEDA_1', 'BUSQUEDA_2'] });

const photoData = {}; /* fid -> {bytes, format} */
function b64ToBytes(b64) {
  const bin = atob(b64);
  const len = bin.length, out = new Uint8Array(len);
  for (let i = 0; i < len; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function buildForm() {
  const form = $('form');
  form.innerHTML = '';
  const err = document.createElement('div');
  err.id = 'err'; form.appendChild(err);
  SECTIONS.forEach((sec) => {
    const box = document.createElement('section');
    box.className = 'card'; box.id = 'sec-' + sec.id;
    box.innerHTML = '<h2>' + esc(sec.title) + '</h2><p class="hint">' + esc(sec.hint) + '</p>';
    sec.fields.forEach((fid) => {
      const field = TPL.fields.find((x) => x.id === fid);
      if (!field) return;
      const lab = document.createElement('label');
      lab.className = 'f'; lab.setAttribute('data-field', fid);
      const req = isReq(fid) ? ' <span class="req">*</span>' : '';
      lab.innerHTML = '<span>' + esc(qLabel(fid)) + req + '</span>';
      if (isPhoto(fid)) {
        const row = document.createElement('div');
        row.className = 'photorow';
        const im = document.createElement('img'); im.alt = '';
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp';
        inp.setAttribute('data-photo', fid);
        inp.onchange = () => loadPhoto(fid, inp.files[0], im);
        row.appendChild(im); row.appendChild(inp);
        lab.appendChild(row);
      } else if (isLong(fid)) {
        const ta = document.createElement('textarea');
        ta.setAttribute('data-fid', fid); ta.rows = 3;
        lab.appendChild(ta);
      } else {
        const inp = document.createElement('input');
        inp.type = 'text'; inp.setAttribute('data-fid', fid);
        inp.maxLength = field.maxLength || 70;
        lab.appendChild(inp);
      }
      box.appendChild(lab);
    });
    form.appendChild(box);
  });
}
/* Recorta con canvas al aspecto del marco (cover) y comprime a JPEG. */
function coverCrop(img, aspect) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  let sw, sh;
  if (iw / ih > aspect) { sh = ih; sw = ih * aspect; }
  else { sw = iw; sh = iw / aspect; }
  const cv = document.createElement('canvas');
  const TW = 600;
  cv.width = TW; cv.height = Math.round(TW / aspect);
  cv.getContext('2d').drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, 0, 0, cv.width, cv.height);
  return cv;
}
function loadPhoto(fid, file, imEl) {
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { showErr('La foto supera los 10 MB.'); return; }
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    try {
      const slot = findSlot(fid);
      const aspect = slot ? slot.w / slot.h : 1;
      const cv = coverCrop(img, aspect);
      cv.toBlob((blob) => {
        const r = new FileReader();
        r.onload = () => {
          const b64 = String(r.result).split(',')[1];
          photoData[fid] = { bytes: b64ToBytes(b64), format: 'jpg' };
          imEl.src = URL.createObjectURL(blob);
          imEl.classList.add('show');
        };
        r.readAsDataURL(blob);
      }, 'image/jpeg', 0.85);
    } finally { URL.revokeObjectURL(url); }
  };
  img.onerror = () => showErr('No se pudo leer esa imagen.');
  img.src = url;
}
function findSlot(fid) {
  for (const p of TPL.pages) for (const s of p.slots) if (s.field === fid) return s;
  return null;
}
function showErr(msg) {
  let e = $('err');
  if (!e) return;
  if (!msg) { e.style.display = 'none'; e.textContent = ''; return; }
  e.textContent = msg; e.style.display = '';
  e.scrollIntoView({ block: 'center' });
}
function collect() {
  showErr(null);
  const values = {};
  let bad = null;
  document.querySelectorAll('#form [data-fid]').forEach((el) => {
    const fid = el.getAttribute('data-fid');
    values[fid] = el.value.trim();
    const lab = el.closest('label.f');
    if (lab) lab.classList.remove('bad');
    if (isReq(fid) && !values[fid]) {
      if (lab) lab.classList.add('bad');
      if (!bad) bad = lab;
    }
  });
  return { values, bad };
}
const EJEMPLO = {
  NOMBRE_CUMPLE: 'Ian', FAMA: 'Comer hamburguesas', DEBILIDAD: 'Llegar tarde',
  TALENTO: 'Contar chistes', SOSPECHA: 'Robo de tarta', OTRO: 'Roncar',
  RESULTADO_TEST: 'vista', 'NOMBRE_4.2': 'Alex',
  MENSAJE_PERSONALIZADO: '¿Vienes esta noche?\nTe espero a las 9',
  BUSQUEDA_1: 'cómo abrir una caja fuerte', BUSQUEDA_2: 'ideas de regalos',
  NOMBRE_1: 'Celia', NOMBRE_2: 'Nuria', NOMBRE_3: 'Adela', NOMBRE_4: 'Adam',
  NOMBRE_5: 'Dani', NOMBRE_6: 'Pol', NOMBRE_7: 'Marc', NOMBRE_8: 'Clau',
  S1_HIDEA: 'Al lado de la basura de la cocina', S1_HIDEB: 'Estaba sentada frente al ordenador',
  S2_HIDEA: 'Estaba en la cama', S2_HIDEB: 'Estaba en el sofá',
  S3_HIDEA: 'Delante de un cuadro', S3_HIDEB: 'Viendo arte en la tele',
  S4_HIDEA: 'Estaba tumbado en el sofá', S4_HIDEB: 'Encima de una alfombra',
  S5_HIDEA: 'Al lado del ordenador', S5_HIDEB: 'En un sillón con portátil',
  S6_HIDEA: 'Apoyado en la encimera', S6_HIDEB: 'Mirando una estantería',
  S7_HIDEA: 'Mirando por la ventana', S7_HIDEB: 'Abriendo un armario',
  S8_HIDEA: 'Al lado de una mesilla', S8_HIDEB: 'Abriendo la nevera',
};
function fillExample() {
  document.querySelectorAll('#form [data-fid]').forEach((el) => {
    const fid = el.getAttribute('data-fid');
    if (EJEMPLO[fid] !== undefined) el.value = EJEMPLO[fid];
    const lab = el.closest('label.f');
    if (lab) lab.classList.remove('bad');
  });
  const sample = b64ToBytes(PME_DEMO_DATA.samplePhoto);
  TPL.fields.filter((f) => f.type === 'image').forEach((f) => {
    photoData[f.id] = { bytes: sample, format: 'jpg' };
  });
  document.querySelectorAll('.photorow img').forEach((im) => {
    im.src = 'data:image/jpeg;base64,' + PME_DEMO_DATA.samplePhoto;
    im.classList.add('show');
  });
  showErr(null);
  $('status').textContent = 'Ejemplo cargado (textos; sube fotos o usa las de ejemplo al generar).';
}
async function generate() {
  const { values, bad } = collect();
  if (bad) {
    showErr('Faltan campos obligatorios (marcados en rojo).');
    bad.scrollIntoView({ block: 'center' });
    return;
  }
  const lang = (document.querySelector('input[name="lang"]:checked') || {}).value || 'es';
  const btn = $('bGo');
  btn.disabled = true;
  $('dl').style.display = 'none';
  const bar = $('progress');
  bar.style.display = 'block';
  const fill = bar.firstElementChild;
  $('status').textContent = 'Componiendo PDF…';
  try {
    await new Promise((r) => setTimeout(r, 30));
    const fonts = {};
    for (const k of Object.keys(PME_DEMO_DATA.fonts)) {
      fonts[k] = { bytes: b64ToBytes(PME_DEMO_DATA.fonts[k].b64), subset: PME_DEMO_DATA.fonts[k].subset };
    }
    /* Si no subiste foto, usa la de ejemplo para no dejar huecos vacíos */
    const sample = b64ToBytes(PME_DEMO_DATA.samplePhoto);
    const photos = {};
    TPL.fields.filter((f) => f.type === 'image').forEach((f) => {
      photos[f.id] = photoData[f.id] || { bytes: sample, format: 'jpg' };
    });
    const res = await PMECompose.composeGame({
      bgBytes: b64ToBytes(PME_DEMO_DATA.bg),
      fonts, template: TPL, fixed: PME_DEMO_DATA.texts,
      i18n: PME_DEMO_DATA.i18n[lang], i18nAll: PME_DEMO_DATA.i18n, lang,
      values, photos,
      onProgress: (p) => { fill.style.width = Math.round(p * 100) + '%'; },
    });
    const blob = new Blob([res.bytes], { type: 'application/pdf' });
    const a = $('dl');
    if (a.href && a.href.startsWith('blob:')) URL.revokeObjectURL(a.href);
    a.href = URL.createObjectURL(blob);
    a.download = 'escape-personalizado-' + lang + '.pdf';
    a.style.display = '';
    $('status').textContent = 'Listo (' + (res.bytes.length / 1024 / 1024).toFixed(1) + ' MB)' +
      (res.warns.length ? ' · ' + res.warns.length + ' avisos (ver consola)' : '');
    if (res.warns.length && window.console) console.warn(res.warns);
  } catch (e) {
    showErr('Fallo al generar: ' + (e && e.message ? e.message : e));
  } finally {
    btn.disabled = false;
    bar.style.display = 'none';
  }
}
$('bExample').onclick = fillExample;
$('bGo').onclick = generate;
buildForm();
</script>
</body>
</html>
