  #cnav { display: flex; gap: 10px; align-items: center; padding-top: 12px; }
  #cnav button {

  .checkline { gap: 12px; }

    ul.style.cssText = 'font-size:15px;line-height:1.7;margin:0 0 6px;padding-left:20px;';
    s.bullets.forEach(function (b) { var li = document.createElement('li'); li.innerHTML = b; ul.appendChild(li); });
    A.appendChild(ul);

    be.style.cssText = 'margin-top:14px;font-size:14px;font-weight:800;cursor:pointer;padding:11px 22px;border:2px solid var(--abyss);border-radius:8px;background:#fff;color:var(--ink);min-height:48px;';

}
function goNext() {
  if (view === 'review') { finish(); return; }
  if (view === 'done') return;
  if (isMobile()) { mobileNext(); return; }
  var s = SCREENS[idx];
  s.fields.forEach(function (f) { if (f.type === 'multi') collectMulti(f.id); else readControl(f, $('answer')); });
  saveDraft();
  if (paintErrors($('answer'), s.fields)) { showErr('Revisa los campos marcados.'); return; }
  idx++;
  saveDraft(); view = 'steps'; render(); window.scrollTo(0, 0);
}
function goBack() {
  if (view === 'review') {
    if (isMobile()) { view = 'steps'; render(); window.scrollTo(0, 0); }
    else { idx = SCREENS.length - 1; view = 'steps'; render(); window.scrollTo(0, 0); }
    return;
  }
  if (view === 'done') return;
  if (isMobile()) {
    if (view === 'steps' && secPos > 0) {
      readAll($('mwrap')); secPos--; saveDraft(); render(); window.scrollTo(0, 0);
    }
    return;
  }
  var s = SCREENS[idx];
  if (s) s.fields.forEach(function (f) { if (f.type === 'multi') collectMulti(f.id); else readControl(f, $('answer')); });
  saveDraft();
  if (idx > 0) { idx--; render(); window.scrollTo(0, 0); }

    if (!w || !h) { cb('No se pudo leer esa imagen. Prueba con JPG o PNG.'); return; }
    if (Math.min(w, h) < PHOTO_MIN_SIDE) {
      cb('La foto es demasiado pequeña (' + w + ' × ' + h + ' px). Usa una de al menos ' + PHOTO_MIN_SIDE + ' px en su lado corto.');
      return;
    }
    var k = Math.min(1, PHOTO_MAX_SIDE / Math.max(w, h));
    var cv = document.createElement('canvas');
    cv.width = Math.round(w * k); cv.height = Math.round(h * k);
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    cb(null, cv.toDataURL('image/jpeg', 0.92));
  };
  img.onerror = function () { URL.revokeObjectURL(url); cb('No se pudo leer esa imagen. Prueba con JPG o PNG.'); };
  img.src = url;
}
$('filepick').onchange = function (e) {
  var f = e.target.files[0]; e.target.value = '';
  if (!f || !photoTarget) return;
  var fid = photoTarget; photoTarget = null;
  if (f.size > 10 * 1024 * 1024) { showErr('La foto supera los 10 MB. Elige otra.'); return; }
  if (f.type && !/^image\//.test(f.type)) { showErr('El archivo no es una imagen. Usa JPG, PNG o WebP.'); return; }
  loadPhoto(f, function (err, dataUrl) {
    if (err) { showErr(err); return; }
    var key = 'photo_' + fid;
    photos[key] = dataUrl;
    idb.save(key, dataUrl);
    saveDraft(); render();
  });
};

/* ---------- arranque ---------- */
saveDraft();
render();
idb.open(function () {
  idb.loadAll(function (ph) {
    var n = 0;
    for (var k in ph) { photos[k] = ph[k]; n++; }
    if (n) render();
  });
});
</script>
</body>
