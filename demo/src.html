<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>PrintMyEscape · Demo personalización</title>
<style>
  :root {
    --abyss: #0c2a2f; --abyss-2: #14404a; --teal: #0e7463; --teal-deep: #0a574a;
    --sage: #b7c29b; --paper: #faf6ec; --ink: #22302a; --danger: #c0392b; --muted: #4c5d53;
  }
  /* Hasta que el script monta la interfaz (la página lleva varios MB de librerías en línea),
     no se pinta el esqueleto: así no aparece un destello de la maquetación de escritorio en móvil. */
  body:not(.ready) #progress, body:not(.ready) #top, body:not(.ready) main, body:not(.ready) #nav, body:not(.ready) #foot { visibility: hidden; }
  * { box-sizing: border-box; }
  ::selection { background: var(--teal); color: #fff; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background-color: var(--paper);
    background-image: radial-gradient(rgba(12,42,47,.07) 1px, transparent 1.5px);
    background-size: 22px 22px;
    -webkit-tap-highlight-color: transparent;
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
  }
  button, input, textarea, select { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--sage); outline-offset: 2px; }
  #progress { height: 8px; background: rgba(12,42,47,.12); }
  #progress > div {
    height: 100%; width: 0%; background: linear-gradient(90deg, var(--teal), var(--sage));
    transition: width .3s ease;
  }
  #top {
    display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 30;
    padding: 10px 16px; color: #fff;
    background: linear-gradient(135deg, var(--abyss) 0%, var(--abyss-2) 100%);
    border-bottom: 4px solid var(--teal);
  }
  #menuBtn {
    display: none;
    font-size: 14px; font-weight: 900; cursor: pointer; border: 0; border-radius: 8px;
    padding: 10px 14px; color: #fff; background: #1e4d55; min-height: 44px;
  }
  #menuBtn:hover { filter: brightness(1.2); }
  #top h1 { font-size: 15px; margin: 0; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
  #top h1 .sub { color: var(--sage); }
  #top h1 .sub::before { content: ' · '; }
  #draftinfo { font-size: 11px; color: var(--sage); }
  #stepcount { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--sage); white-space: nowrap; }
  #langSwitch {
    display: inline-flex; flex: none; border: 2px solid var(--sage); border-radius: 999px; overflow: hidden;
  }
  #langSwitch button {
    font-size: 12px; font-weight: 900; letter-spacing: .08em; cursor: pointer; border: 0;
    background: transparent; color: var(--sage); padding: 7px 12px; min-height: 34px;
  }
  #langSwitch button.on { background: var(--sage); color: var(--abyss); }
  #langSwitch button:not(.on):hover { background: rgba(183,194,155,.18); }
  main { flex: 1; display: flex; align-items: flex-start; justify-content: center; gap: 18px; padding: 28px 16px 90px; }
  #card {
    width: min(94vw, 680px); background: #fffdf6;
    border: 3px solid var(--abyss); border-radius: 14px;
    box-shadow: 8px 8px 0 rgba(14,116,99,.25);
    padding: 30px 30px 26px;
    background-image: linear-gradient(180deg, rgba(183,194,155,.2), rgba(183,194,155,0) 160px);
    animation: in .25s ease;
  }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  #kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
    background: var(--abyss); color: #fff; padding: 5px 12px; border-radius: 3px 10px 10px 3px;
    border-left: 5px solid var(--teal); margin-bottom: 14px; max-width: 100%;
  }
  #kicker img { width: 30px; height: 30px; object-fit: cover; border-radius: 50%; border: 2px solid var(--sage); }
  #q { font-size: 26px; font-weight: 900; line-height: 1.25; margin: 0 0 6px; letter-spacing: -.01em; }
  #desc { font-size: 14px; color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
  #card ul { padding-left: 20px; margin: 0 0 14px; }
  #card li { margin-bottom: 6px; }
  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 4px; }
  .field > label { display: block; font-size: 16px; font-weight: 900; margin-bottom: 2px; }
  .field > label .req { color: var(--danger); }
  .field .fdesc { font-size: 13px; color: var(--muted); margin: 0 0 8px; line-height: 1.5; }
  .field .fdesc .ej { display: block; margin-top: 6px; font-style: italic; background: rgba(183,194,155,.25); padding: 8px 10px; border-radius: 6px; }
  .field input[type="text"], .field input[type="number"], .field textarea {
    width: 100%; font-size: 19px; color: var(--ink);
    border: 0; border-bottom: 3px solid var(--abyss); background: transparent;
    padding: 10px 2px; outline: none;
  }
  .field input:focus, .field textarea:focus { border-bottom-color: var(--teal); }
  /* tamaño fijo, pensado para que quepan los 200 caracteres sin barra de desplazamiento */
  .field textarea { border: 2px solid var(--abyss); border-radius: 8px; padding: 12px; height: 216px; font-size: 16px; line-height: 1.5; resize: none; overflow-y: auto; }
  /* textos cortos (hasta 70 caracteres): caja de 3 líneas */
  .field textarea.short { height: 96px; }
  .field textarea:focus { border-color: var(--teal); }
  .count { font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }
  .ferr { display: none; color: #fff; background: var(--danger); font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 6px; margin-top: 8px; }
  .field.bad input, .field.bad textarea { border-color: var(--danger); }
  .field.bad .ferr { display: block; }
  #err { display: none; color: #fff; background: var(--danger); font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 6px; margin-top: 10px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    font-size: 14px; font-weight: 700; padding: 10px 16px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--abyss); background: #fff; color: var(--ink); user-select: none; min-height: 44px;
  }
  .pill.on { background: var(--teal); border-color: var(--teal-deep); color: #fff; }
  .otherWrap { margin-top: 12px; display: none; }
  .otherWrap.show { display: block; }
  #toast {
    display: none; position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 96px; z-index: 60; background: var(--danger); color: #fff;
    font-size: 13px; font-weight: 800; padding: 10px 16px; border-radius: 8px; max-width: 90vw;
  }
  #toast.ok { background: var(--teal-deep); }
  .photobox {
    border: 3px dashed var(--teal); border-radius: 10px; background: rgba(14,116,99,.06);
    padding: 22px; text-align: center; cursor: pointer;
  }
  .photobox:hover { background: rgba(14,116,99,.12); }
  .photobox img { max-width: 100%; max-height: 260px; border-radius: 8px; border: 3px solid var(--abyss); }
  .photobox .ph-t { font-weight: 900; font-size: 16px; }
  .photobox .ph-s { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .photorm { margin-top: 8px; font-size: 12px; font-weight: 800; cursor: pointer; border: 2px solid var(--danger); background: #fff; color: var(--danger); border-radius: 6px; padding: 7px 12px; min-height: 40px; }
  #nav { display: none; }
  body.mobile #nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; gap: 10px; align-items: center; justify-content: center;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(250,246,236,.95); border-top: 3px solid var(--abyss);
  }
  #nav button {
    font-size: 16px; font-weight: 900; letter-spacing: .02em; cursor: pointer; border: 0;
    padding: 13px 30px; color: #fff; background: var(--teal); border-radius: 8px;
    box-shadow: 3px 3px 0 var(--abyss); transition: transform .1s ease; min-height: 48px;
  }
  #nav button:hover { filter: brightness(1.1); }
  #nav button:active { transform: translateY(2px); box-shadow: 1px 1px 0 var(--abyss); }
  #nav button.ghost { background: #fff; color: var(--ink); border: 2px solid var(--abyss); box-shadow: none; }
  #nav button:disabled { opacity: .45; cursor: not-allowed; }
  #hintkeys { font-size: 12px; color: var(--muted); }
  /* ---- menú de secciones: sidebar fija en desktop, lámina en móvil ---- */
  #scrim { display: none; position: fixed; inset: 0; background: rgba(12,42,47,.5); z-index: 40; }
  #scrim.open { display: block; }
  #drawer {
    width: 292px; flex: none; position: sticky; top: 12px; max-height: calc(100dvh - 150px);
    background: #fffdf6; border: 3px solid var(--abyss); border-radius: 12px;
    box-shadow: 6px 6px 0 rgba(14,116,99,.25);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #drawer h2 { margin: 0; padding: 14px 16px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; background: var(--abyss); color: #fff; }
  #drawerList { overflow-y: auto; padding: 10px; flex: 1; min-height: 0; }
  #ccol { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; max-width: 680px; min-height: 0; }
  #cnav { display: flex; gap: 10px; align-items: center; padding-top: 12px; }
  #cnav button {
    font-size: 16px; font-weight: 900; letter-spacing: .02em; cursor: pointer; border: 0; border-radius: 8px;
    padding: 13px 26px; color: #fff; background: var(--teal); min-height: 50px;
    box-shadow: 3px 3px 0 var(--abyss);
  }
  #cnav button:hover { filter: brightness(1.1); }
  #cnav button:active { transform: translateY(2px); box-shadow: 1px 1px 0 var(--abyss); }
  #cnav button.ghost { background: #fff; color: var(--ink); border: 2px solid var(--abyss); box-shadow: none; }
  #cnav button:disabled { opacity: .45; cursor: not-allowed; }
  #cnav .dhint { flex: 1; text-align: center; font-size: 12px; color: var(--muted); }
  #cnav #dnext { margin-left: auto; }
  body.mobile #cnav { display: none; }
  /* ---- desktop: una pantalla, sin scroll (la tarjeta absorbe el sobrante) ---- */
  body:not(.mobile) { height: 100vh; height: 100dvh; overflow: hidden; }
  body:not(.mobile) main { flex: 1 1 auto; min-height: 0; align-items: stretch; }
  body:not(.mobile) #drawer { align-self: stretch; max-height: none; }
  body:not(.mobile) #card { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  #foot {
    text-align: center; font-size: 12px; font-weight: 700; color: var(--abyss);
    border-top: 3px solid var(--abyss); padding: 14px 16px calc(18px + env(safe-area-inset-bottom));
    background: rgba(183,194,155,.25);
  }
  body.mobile #menuBtn { display: block; order: 5; }
  body.mobile #top h1 { flex: 1; font-size: 13px; line-height: 1.3; }
  body.mobile #top h1 .sub { display: block; font-size: 11px; letter-spacing: .12em; }
  body.mobile #top h1 .sub::before { content: ''; }
  body.mobile #stepcount { margin-left: 0; }
  body.mobile main { display: block; padding: 16px 12px 120px; }
  body.mobile #top { position: sticky; top: 0; z-index: 30; }
  body.mobile #drawer {
    width: 100%; position: fixed; top: auto; bottom: 0; right: 0; left: 0; max-height: 70dvh;
    border: 0; border-top: 4px solid var(--abyss); border-radius: 14px 14px 0 0;
    transform: translateY(105%); transition: none; z-index: 41; /* sin transición al entrar en móvil: no debe deslizarse en pantalla */
  }
  body.mobile #drawer.open { transform: none; transition: transform .25s ease; }
  .secItem {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;
    border: 2px solid transparent; background: none; color: var(--ink);
    border-radius: 8px; padding: 11px 10px; min-height: 48px;
  }
  .secItem:hover { background: rgba(14,116,99,.1); }
  .secItem.cur { border-color: var(--teal); background: rgba(14,116,99,.12); }
  .secItem .dot {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; background: rgba(12,42,47,.12); color: var(--ink);
  }
  .secItem.done .dot { background: var(--teal); color: #fff; }
  .secItem .miss { margin-left: auto; font-size: 11px; color: var(--danger); white-space: nowrap; }
  /* ---- botones ---- */
  .btn-primary {
    font-size: 17px; font-weight: 900; letter-spacing: .02em; cursor: pointer; border: 0; border-radius: 10px;
    padding: 15px 30px; color: #fff; background: var(--teal); min-height: 56px;
    box-shadow: 4px 4px 0 var(--abyss); transition: transform .1s ease, filter .15s ease;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--abyss); }
  .btn-primary:disabled { opacity: .5; cursor: wait; }
  .btn-ghost {
    font-size: 14px; font-weight: 800; cursor: pointer; background: #fff; color: var(--ink);
    border: 2px solid var(--abyss); border-radius: 10px; padding: 11px 18px; min-height: 48px;
  }
  .btn-ghost:hover { background: rgba(12,42,47,.05); }
  .btn-ghost.danger { color: var(--danger); border-color: var(--danger); }
  /* ---- revisión ---- */
  .review-tools { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; font-size: 13px; font-weight: 700; }
  .review-tools input { width: 20px; height: 20px; accent-color: var(--teal); }
  #dupwarn { display: none; background: #fdf0e6; border: 2px solid #d35400; color: #7e3b00; font-size: 13px; font-weight: 700; padding: 9px 12px; border-radius: 8px; margin-bottom: 12px; }
  .review-group { border: 2px solid var(--abyss); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .review-group h3 {
    margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .06em;
    background: var(--abyss); color: #fff; padding: 9px 12px;
  }
  .review-row { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border-top: 1px solid rgba(12,42,47,.12); font-size: 14px; }
  .review-row:first-of-type { border-top: 0; }
  .review-row b { flex: 0 0 130px; color: var(--teal-deep); }
  .review-row span { flex: 1; overflow-wrap: anywhere; }
  .review-row .miss { color: var(--danger); font-weight: 700; }
  .review-row button {
    flex: none; font-size: 11px; font-weight: 800; cursor: pointer;
    border: 2px solid var(--teal); background: #fff; color: var(--teal-deep);
    border-radius: 6px; padding: 6px 10px; min-height: 36px;
  }
  .review-thumb { max-height: 60px; border-radius: 6px; border: 2px solid var(--abyss); }
  /* ---- pantalla final ---- */
  #done { text-align: center; }
  #done .big { font-size: 52px; line-height: 1; margin-bottom: 6px; }
  #done .langnote { font-size: 14px; color: var(--muted); margin: 6px 0 18px; }
  #done .langnote b { color: var(--teal-deep); }
  #done .acts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
  #done .dupline { color: var(--danger); font-weight: 800; }
  #genstatus { min-height: 1.2em; font-size: 14px; font-weight: 700; color: var(--teal-deep); margin: 14px 0 6px; }
  #dl { display: none; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  #dl a {
    font-size: 14px; font-weight: 800; text-decoration: none; color: var(--teal-deep);
    border: 2px solid var(--teal); border-radius: 999px; padding: 9px 18px; background: #fff;
  }
  #dl a:hover { background: var(--teal); color: #fff; }
  #done details { text-align: left; margin-top: 14px; font-size: 13px; }
  /* ---- inicio: idioma y ejemplos ---- */
  .landing { display: flex; flex-direction: column; gap: 14px; }
  .steps3 { display: flex; flex-wrap: wrap; gap: 8px; }
  .steps3 span {
    font-size: 12px; font-weight: 800; color: var(--muted);
    background: rgba(12,42,47,.06); border-radius: 999px; padding: 6px 12px;
  }
  .steps3 span.on { background: var(--teal); color: #fff; }
  .lg-head, .ex-head {
    font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    margin-bottom: -8px;
  }
  .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .lang-card {
    position: relative; text-align: left; cursor: pointer; background: #fff; color: var(--ink);
    border: 3px solid var(--abyss); border-radius: 14px; padding: 14px 16px 12px; min-height: 0;
    box-shadow: 4px 4px 0 rgba(12,42,47,.18); transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .lang-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 rgba(12,42,47,.18); }
  .lang-card .code {
    display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 11px;
    background: var(--abyss); color: #fff; font-size: 15px; font-weight: 900; letter-spacing: .06em;
  }
  .lang-card .name { display: block; font-size: 20px; font-weight: 900; margin-top: 8px; }
  .lang-card .sub { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .lang-card .tick {
    position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--abyss); display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 900; color: transparent;
  }
  .lang-card.on { background: linear-gradient(160deg, #e3f1ec, #fffdf6); border-color: var(--teal); box-shadow: 5px 5px 0 var(--teal); }
  .lang-card.on .code { background: var(--teal); }
  .lang-card.on .tick { background: var(--teal); border-color: var(--teal-deep); color: #fff; }
  .ex-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 760px) and (min-width: 641px) { .ex-grid { grid-template-columns: repeat(2, 1fr); } }
  .ex-card {
    display: flex; flex-direction: column; gap: 4px; background: #fff;
    border: 2px solid var(--abyss); border-radius: 12px; padding: 12px 14px 12px; min-width: 0;
  }
  .ex-card.locked { opacity: .6; }
  .stress-note { font-size: 13px; line-height: 1.4; color: #7e3b00; background: #fdf0e6; border: 2px dashed #d35400; border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; }
  .ex-card .n { font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--teal-deep); }
  .ex-card .who { font-size: 18px; font-weight: 900; line-height: 1.2; }
  .ex-card .teaser { font-size: 13px; color: var(--muted); line-height: 1.4; flex: 1; }
  .ex-card button {
    margin-top: 6px; font-size: 14px; font-weight: 800; cursor: pointer; color: #fff; background: var(--teal);
    border: 0; border-radius: 9px; padding: 9px 12px; min-height: 40px; box-shadow: 2px 2px 0 var(--abyss);
  }
  .ex-card button:hover { filter: brightness(1.1); }
  .ex-card button:disabled { background: #8a9a92; box-shadow: none; cursor: not-allowed; }
  /* tarjetas de ejemplo y de "Empezar en blanco": iguales, con el botón siempre abajo */
  .ex-grid .ex-card { padding: 10px 12px; }
  .ex-grid .ex-card button { margin-top: auto; padding: 8px 10px; }
  @media (min-width: 641px) { .landing { gap: 12px; } } /* en escritorio cabe toda la portada sin scroll */
  .ex-note { font-size: 13px; color: var(--muted); background: rgba(183,194,155,.3); border-radius: 8px; padding: 10px 12px; }
  .landing-foot { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .linkish {
    font-size: 14px; font-weight: 800; cursor: pointer; background: none; border: 0; color: var(--teal-deep);
    padding: 8px 4px; text-decoration: underline; text-underline-offset: 3px;
  }
  .linkish:disabled { color: #8a9a92; cursor: not-allowed; text-decoration: none; }
  /* ---- modo móvil: página con scroll ---- */
  #mwrap { display: none; width: min(94vw, 620px); padding-bottom: 110px; }
  body.mobile #card { display: none; }
  body.mobile #mwrap { display: block; }
  body.mobile.showcard #card { display: block; }
  body.mobile.showcard #mwrap { display: none; }
  body.mobile main { align-items: stretch; }
  .msec { background: #fffdf6; border: 3px solid var(--abyss); border-radius: 12px; box-shadow: 6px 6px 0 rgba(14,116,99,.25); margin-bottom: 18px; overflow: hidden; }
  .msec > h2 {
    margin: 0; padding: 12px 16px; font-size: 15px; text-transform: uppercase; letter-spacing: .06em;
    background: var(--abyss); color: #fff; position: sticky; top: 0; display: flex; align-items: center; gap: 8px;
  }
  .msec > h2 img { width: 30px; height: 30px; object-fit: cover; border-radius: 50%; border: 2px solid var(--sage); }
  .msec > h2 .mstate { margin-left: auto; font-size: 11px; color: var(--sage); }
  .mscreen { padding: 16px 16px 6px; border-top: 2px dashed rgba(12,42,47,.2); }
  .mscreen:first-of-type { border-top: 0; }
  .mscreen > h3 { margin: 0 0 10px; font-size: 17px; }
  @media (max-width: 1008px), (pointer: coarse) and (max-height: 540px) {
    #draftinfo { display: none; }
    #card { padding: 22px 18px 20px; }
    #q { font-size: 22px; }
    #nav button { padding: 13px 18px; font-size: 15px; }
    #hintkeys { display: none; }
    #langSwitch button { padding: 6px 9px; }
    .review-row { flex-wrap: wrap; }
    .review-row b { flex-basis: 100%; }

function formFromGame(game) {
  var out = { Q: {}, LIMITS: {}, SECDEF: [], examples: { es: [], en: [] } };
  Object.keys(game.fields).forEach(function (id) {
    var f = game.fields[id], q = { q: f.q };

    if (f.ej) q.ej = f.ej;
    if (f.type === 'multi') { q.multi = 1; q.options = f.options; if (f.allowOther) q.other = f.otherField; }
    if (f.type === 'choice') { q.choice = 1; q.options = f.options; }
    if (f.type === 'photo') q.photo = 1;
    if (f.type === 'number') {
      q.num = 1;
      if (f.min !== undefined) q.min = f.min;
      if (f.max !== undefined) q.max = f.max;
    }
    if (f.type === 'long') q.long = 1;
    if (f.cap !== undefined) { out.LIMITS[id] = f.cap; q.max = f.cap; }
    out.Q[id] = q;
  });

    var sec = { id: s.id, title: s.title, fields: s.fields, nameField: s.nameField, photoField: s.photoField };
    if (s.hint) sec.hint = s.hint;
    out.SECDEF.push(sec);
  });
  game.examples.forEach(function (ex) {
    out.examples.es.push(ex.values.es);
    out.examples.en.push(ex.values.en);
  });
  return out;
}

function collectMulti(fid, scope) {

  if (scope && !scope.querySelector('.field[data-field="' + fid + '"]')) return;

    var v = pills[i].getAttribute('data-v');

  if (oi && oi.value.trim()) {
    vals.push(t('otherTag') + ': ' + oi.value.trim());
    multiOther[fid] = oi.value.trim();
  } else { delete multiOther[fid]; }
  answers[fid] = vals.join('||');

}
function readControl(f, scope) {

  if (f.type === 'check') { answers[f.id] = c.checked ? '1' : ''; return; }

}

function fieldError(f) {

  if (f.required && (f.type === 'text' || f.type === 'long' || f.type === 'choice') && !answers[f.id]) return t('errRequired');
  if (f.type === 'photo' && f.required && !photos['photo_' + f.id]) return t('errPhoto');
  if (f.type === 'number' && f.required) {
    var n = parseInt(answers[f.id], 10);

}

function goNext() {

  if (isMobile()) { mobileNext(); return; }
  var s = SCREENS[idx];
  if (s.landing) {
    if (!LANG) { showErr(t('errLangFirst')); return; }
    idx = welcomeIndex(); saveDraft(); view = 'steps'; render(); window.scrollTo(0, 0);
    return;
  }
  s.fields.forEach(function (f) { if (f.type === 'multi') collectMulti(f.id); else readControl(f, $('answer')); });
  saveDraft();
  if (s.welcome) {
    if (!LANG) { showErr(t('errLangFirst')); return; }
    if (answers.intro_ok !== '1') { paintErrors($('answer'), s.fields); showErr(t('errCheck')); return; }
  }
  if (paintErrors($('answer'), s.fields)) { showErr(t('errReview')); return; }
  idx++;
  saveDraft(); view = 'steps'; render(); window.scrollTo(0, 0);
}
function goBack() {
  if (view === 'review') {

    else { idx = SCREENS.length - 1; view = 'steps'; render(); window.scrollTo(0, 0); }
    return;
  }
  if (view === 'done') return;

      readAll($('mwrap')); secPos--; saveDraft(); render(); window.scrollTo(0, 0);

  if (!fid || !tg.tagName || (tg.tagName !== 'INPUT' && tg.tagName !== 'TEXTAREA') || tg.type === 'number') return;
  var multi = tg.tagName === 'TEXTAREA';
  if (fitsText(fid, tg.value, multi)) { tg._good = tg.value; return; }
  /* se queda el trozo más largo que cabe (un pegado largo no borra lo que ya cabía) */
  var caret = tg.selectionStart, keep = longestFit(fid, tg.value, multi);
  tg.value = keep;
  tg._good = keep;
  try { var np = Math.min(caret == null ? keep.length : caret, keep.length); tg.setSelectionRange(np, np); } catch (x) {}
  showToast(t('fullField'));
}, true);
/* Borradores guardados con los límites anteriores: se recortan a lo que cabe, sin avisos. */
function trimStored() {
  var changed = false;
  TPL.fields.forEach(function (f) {
    if (f.type !== 'text' && f.type !== 'long') return;
    var fid = f.id, raw = answers[fid];
    if (!raw) return;
    var spec = mkField(fid);
    if (spec.type === 'number') {
      var num = parseInt(raw, 10);
      if (!isNaN(num)) {
        var fixed = Math.min(spec.max, Math.max(spec.min, num));
        if (String(fixed) !== String(raw)) { answers[fid] = String(fixed); changed = true; }
      }
      return;
    }
    /* casillas de delitos: opciones fijas, no se recortan */
    if (Q[fid] && (Q[fid].multi || Q[fid].choice)) return;
    var v = String(raw);
    if (LIMITS[fid] && v.length > LIMITS[fid]) v = v.slice(0, LIMITS[fid]);
    v = longestFit(fid, v, f.type === 'long');
    if (v !== raw) { answers[fid] = v; changed = true; }
  });
  return changed;
}
/* Opciones múltiples (debilidades): no se añade una opción si ya no cabe en su hueco. */
function fitsOptions(fid, wrap) {
  var labels = [];
  wrap.querySelectorAll('.pill.on[data-v]').forEach(function (p) { labels.push(p.getAttribute('data-v')); });
  return fitsText(fid, labels.join(' / '), false);
}
function generatePDF() {
  textProblems().then(function (bad) {
    if (bad.length) {
      showErr(fmt(t('errLong'), bad.join(', ')));
      markTooLong();
      return;
    }
    generatePDFNow();
  }, function () { generatePDFNow(); });
}
function generatePDFNow() {
  var st = $('genstatus');
  var lang = LANG || 'es';
  var btn = $('bGen');
  if (btn) btn.disabled = true;
  if (st) st.textContent = t('generating');
  setTimeout(function () {
    try {
      var FD = PME_DEMO_DATA.fonts, fonts = {};
      for (var k in FD) fonts[k] = { bytes: b64ToBytes(FD[k].b64), subset: FD[k].subset };
      var ph = {}, faltan = [];
      TPL.fields.forEach(function (f) {
        if (f.type !== 'image') return;
        var key = 'photo_' + f.id;
        if (photos[key]) ph[f.id] = dataURLToBytes(photos[key]); else faltan.push(f.id);
      });
      if (faltan.length) {
        if (st) st.textContent = '';
        if (btn) btn.disabled = false;
        showErr(fmt(t('errPhotosMissing'), faltan.join(', ')));
        return;
      }
      /* Copia de las respuestas: el motor interpreta las debilidades (||) y el "Otro". */
      var vals = {};
      Object.keys(answers).forEach(function (kk) { vals[kk] = answers[kk]; });
      var bar = $('progress').firstElementChild;
      PMECompose.composeGame({
        bgBytes: b64ToBytes(PME_DEMO_DATA.bg), fonts: fonts,
        template: TPL, fixed: PME_DEMO_DATA.texts,
        i18n: PME_DEMO_DATA.i18n[lang], i18nAll: PME_DEMO_DATA.i18n, lang: lang,
        values: vals, photos: ph,
        mechanics: PME_DEMO_DATA.game.mechanics || [], fields: PME_DEMO_DATA.game.fields || {},
        onProgress: function (pr) { bar.style.width = Math.round(pr * 100) + '%'; }
      }).then(function (res) {
        var blob = new Blob([res.bytes], { type: 'application/pdf' });
        var a = $('pdflink');
        try { if (a.href && a.href.indexOf('blob:') === 0) URL.revokeObjectURL(a.href); } catch (x) {}
        a.href = URL.createObjectURL(blob);
        a.download = 'escape-personalizado-' + lang + '.pdf';
        $('dl').style.display = 'flex';
        var pv = $('pdfprev');
        watermarkPdf(res.bytes, lang).then(function (wb) {
          try { if (pv.href && pv.href.indexOf('blob:') === 0) URL.revokeObjectURL(pv.href); } catch (x) {}
          pv.href = URL.createObjectURL(new Blob([wb], { type: 'application/pdf' }));
          pv.download = 'vista-previa-' + lang + '.pdf';
        });
        if (st) st.textContent = fmt(t('ready'), (res.bytes.length / 1048576).toFixed(1));
        var det = $('warndet');
        if (det) {
          if (res.warns && res.warns.length) {
            det.style.display = '';
            det.firstElementChild.textContent = fmt(t('warnsCount'), res.warns.length);
            det.lastElementChild.textContent = res.warns.join('; ');
          } else { det.style.display = 'none'; }
        }
        if (btn) btn.disabled = false;
      }, function (err) {
        if (st) st.textContent = '';
        showErr(fmt(t('errFail'), (err && err.message) ? err.message : err));
        if (btn) btn.disabled = false;
      });
    } catch (e) {
      showErr(fmt(t('errFail'), (e && e.message) ? e.message : e));
      var b2 = $('bGen'); if (b2) b2.disabled = false;
    }
  }, 30);
}
window.addEventListener('error', function (ev) {
  try {
    var msg = fmt(t('errUnexpected'), ev.message || ev.type || '?');
    if (ev.lineno) msg += ' (' + ev.lineno + ')';
    if (typeof showErr === 'function') showErr(msg + t('errSuffix'));
  } catch (x) {}
});

/* ---------- menú de secciones ---------- */
function menuStatus(sec) {
  if (sec === 'intro') return (LANG && answers.intro_ok === '1') ? 'done' : '';
  var miss = missingOf(sec);
  return miss.length ? miss.length : 'done';
}
function buildMenu() {
  var L = $('drawerList'); if (!L) return; L.innerHTML = '';
  var cur = currentSec();
  SECTIONS.forEach(function (sec) {
    var b = el('button', 'secItem'); b.type = 'button';
    var st = menuStatus(sec.id);
    if (st === 'done') b.classList.add('done');
    if (cur === sec.id) b.classList.add('cur');
    var dot = el('span', 'dot', st === 'done' ? '✓' : String(SECTIONS.indexOf(sec) + 1));
    b.appendChild(dot);
    b.appendChild(el('span', null, sec.id === 'intro' ? pick(sec.title) : kickerFor(sec.id)));
    if (st !== 'done' && typeof st === 'number') {
      b.appendChild(el('span', 'miss', fmt(t('missingCount'), st)));
    }
    b.onclick = (function (id) { return function () { jumpTo(id); }; })(sec.id);
    L.appendChild(b);
  });
  var rv = el('button', 'secItem' + (view === 'review' ? ' cur' : '')); rv.type = 'button';
  rv.appendChild(el('span', 'dot', '≡'));
  rv.appendChild(el('span', null, t('menuRevision')));
  rv.onclick = function () {
    closeMenu();
    if (!LANG) { jumpTo('intro'); return; }
    if (isMobile()) mobileGoReview();
    else { var s = SCREENS[idx]; if (s && s.fields) s.fields.forEach(function (f) { if (f.type === 'multi') collectMulti(f.id); else readControl(f, $('answer')); }); saveDraft(); view = 'steps'; idx = SCREENS.length; render(); window.scrollTo(0, 0); }
  };
  L.appendChild(rv);
}
function openMenu() {
  buildMenu();
  if (!isMobile()) return; /* en desktop el sidebar siempre está visible */
  $('scrim').classList.add('open');
  $('drawer').classList.add('open');
}
function closeMenu() {
  $('scrim').classList.remove('open');
  $('drawer').classList.remove('open');
}
function jumpTo(sec) {
  closeMenu();
  if (isMobile()) {
    if (view !== 'review') readAll($('mwrap'));
    secPos = secIndex(sec); view = 'steps'; render(); window.scrollTo(0, 0);
  } else {
    var s = SCREENS[idx];
    if (s && s.fields) s.fields.forEach(function (f) { if (f.type === 'multi') collectMulti(f.id); else readControl(f, $('answer')); });
    saveDraft();
    idx = firstScreenOf(sec); view = 'steps'; render(); window.scrollTo(0, 0);
  }
}

/* ---------- render principal ---------- */
function render() {
  closeMenu();
  hideToast();
  $('next').disabled = false; $('dnext').disabled = false;
  if (view === 'done') return;
  applyStatic();
  if (isMobile()) {
    document.body.classList.add('mobile');
    if (view === 'review') { $('mwrap').innerHTML = ''; renderReview($('answer'), true); reviewChrome(); }
    else renderMobile();
  } else {
    document.body.classList.remove('mobile');
    $('mwrap').innerHTML = '';
    $('back').style.display = '';
    $('hintkeys').style.display = '';
    if (view === 'review') { renderReview($('answer'), false); reviewChrome(); }
    else renderStep();
    buildMenu();
  }
  updateDraftInfo(null);
  try {
    var dd = JSON.parse(store.get(DRAFT_KEY) || 'null');
    if (dd && dd.savedAt) updateDraftInfo(dd.savedAt);
  } catch (e) {}
}

/* ---------- eventos ---------- */
$('next').onclick = goNext;
$('back').onclick = goBack;
$('dnext').onclick = goNext;
$('dback').onclick = goBack;
$('menuBtn').onclick = openMenu;
$('scrim').onclick = closeMenu;
document.querySelectorAll('#langSwitch button').forEach(function (b) {
  b.onclick = function () { setLang(b.getAttribute('data-lang')); };
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeMenu(); return; }
  if (e.key !== 'Enter') return;
  if (isMobile() || view !== 'steps' || idx >= SCREENS.length || SCREENS[idx].landing) return;
  var tg = e.target;
  var tag = tg && tg.tagName ? tg.tagName.toLowerCase() : '';
  if (tag === 'textarea' || tag === 'button') return;
  if (tg && tg.type === 'checkbox') return;
  var inputs = $('answer').querySelectorAll('input[type="text"], input[type="number"]');
  var arr = [];
  for (var i = 0; i < inputs.length; i++) arr.push(inputs[i]);
  var at = arr.indexOf(tg);
  e.preventDefault();
  if (at >= 0 && at < arr.length - 1) { try { arr[at + 1].focus(); } catch (ex) {} }
  else goNext();
});
document.addEventListener('input', function (e) {
  var tg = e.target;
  if (!tg || !tg.getAttribute) return;
  var fid = tg.getAttribute('data-fid');
  if (fid && tg.type !== 'checkbox' && (tg.tagName.toLowerCase() === 'input' || tg.tagName.toLowerCase() === 'textarea')) {
    answers[fid] = tg.value;
    saveDraft();
    var w = tg.closest ? tg.closest('.field') : null;
    if (w) {
      var c = w.querySelector('.count');
      if (c) { var f = null; SCREENS.forEach(function (s) { s.fields.forEach(function (x) { if (x.id === fid) f = x; }); }); if (f && f.max) c.textContent = tg.value.length + '/' + f.max; }
      if (w.classList.contains('bad') && tg.value.trim()) { w.classList.remove('bad'); w.querySelector('.ferr').textContent = ''; }
    }
    if (isMobile()) $('progress').firstElementChild.style.width = mobileProgress() + '%';
    buildMenu();
  }
  var other = tg.getAttribute && tg.getAttribute('data-other');
  if (other) collectMulti(other);
});
if (window.matchMedia) {
  var mq = window.matchMedia(MOBILE_MQ);
  var lastMobile = mq.matches;
  var onMq = function () {
    if (mq.matches === lastMobile) return;
    lastMobile = mq.matches;
    if (view === 'steps') readAll(document);
    if (lastMobile) secPos = secIndex(SCREENS[idx] ? SCREENS[idx].sec : 'intro');
    else idx = firstScreenOf(SECTIONS[secPos].id);
    saveDraft(); render();
  };
  if (mq.addEventListener) mq.addEventListener('change', onMq);
  else if (mq.addListener) mq.addListener(onMq);
}
/* Carga de foto: se decodifica, se corrige la orientación EXIF y se re-codifica a JPEG.
   Así cualquier WebP/PNG llega al PDF como JPEG válido y la proporción queda normalizada. */
var PHOTO_MIN_SIDE = 600, PHOTO_MAX_SIDE = 2000;
function loadPhoto(file, cb) {
  var url = URL.createObjectURL(file);
  var img = new Image();
  img.onload = function () {
    URL.revokeObjectURL(url);
    var w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) { cb(t('errReadImage')); return; }
    if (Math.min(w, h) < PHOTO_MIN_SIDE) {
      cb(fmt(t('errSmall'), w, h));
      return;
    }
    var k = Math.min(1, PHOTO_MAX_SIDE / Math.max(w, h));
    var cv = document.createElement('canvas');
    cv.width = Math.round(w * k); cv.height = Math.round(h * k);
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    cb(null, cv.toDataURL('image/jpeg', 0.92));
  };
  img.onerror = function () { URL.revokeObjectURL(url); cb(t('errReadImage')); };
  img.src = url;
}
$('filepick').onchange = function (e) {
  var f = e.target.files[0]; e.target.value = '';
  if (!f || !photoTarget) return;
  var fid = photoTarget; photoTarget = null;
  if (f.size > 10 * 1024 * 1024) { showErr(t('errPhotoSize')); return; }
  if (f.type && !/^image\//.test(f.type)) { showErr(t('errNotImage')); return; }
  loadPhoto(f, function (err, dataUrl) {
    if (err) { showErr(err); return; }
    var key = 'photo_' + fid;
    photos[key] = dataUrl;
    idb.save(key, dataUrl);
    saveDraft(); render();
  });
};

/* ---------- arranque ---------- */
formFonts().then(function (m) { _fitMap = m; if (trimStored()) { saveDraft(); render(); } }, function () {});
try {
  applyStatic();
  saveDraft();
  render();
} finally {
  /* muestra la interfaz ya montada (con la maquetación correcta para el ancho de pantalla) */
  document.body.classList.add('ready');
}
idb.open(function () {
  idb.loadAll(function (ph) {
    var n = 0;
    for (var k in ph) { photos[k] = ph[k]; n++; }
    if (n) render();
  });
});
</script>
